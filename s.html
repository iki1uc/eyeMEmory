<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>shuffle · unwahrscheinlich</title>
<style>
body{background:#02060a;color:#c8d8e8;font-family:monospace;
     display:flex;align-items:center;justify-content:center;
     min-height:100vh;margin:0;flex-direction:column;gap:14px}
#g{display:grid;grid-template-columns:repeat(9,40px);gap:3px}
.c{aspect-ratio:1;border:1px solid #ffffff22;border-radius:3px;
   display:flex;align-items:center;justify-content:center;
   font-size:9px;color:#5a7288;transition:.4s cubic-bezier(.7,0,.3,1)}
.c.hot{border-color:#ff3ea5;color:#ff3ea5;box-shadow:0 0 8px #ff3ea5}
button{background:#0c1828;border:1px solid #ffffff22;color:#c8d8e8;
       padding:8px 20px;border-radius:3px;font-family:inherit;
       font-size:11px;letter-spacing:2px;cursor:pointer}
button:hover{border-color:#ff3ea5;color:#ff3ea5}
</style>
</head>
<body>
<div id="g"></div>
<button onclick="shuffle()">◈ SHUFFLE</button>
<script>
const N=9, NAMES='deinorsuw'.split('');
let cells=[];
for(let i=0;i<N*N;i++){
  const d=document.createElement('div');
  d.className='c'; d.textContent='·';
  document.getElementById('g').appendChild(d);
  cells.push(d);
}
function shuffle(){
  const idx=[...Array(N*N).keys()];
  for(let i=idx.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [idx[i],idx[j]]=[idx[j],idx[i]];
  }
  idx.forEach((from,to)=>{
    const c=cells[to];
    c.textContent = NAMES[from%9] + (Math.floor(from/9)+1);
    c.classList.add('hot');
    setTimeout(()=>c.classList.remove('hot'),400+Math.random()*400);
  });
}
shuffle();
</script>
</body>
</html>
