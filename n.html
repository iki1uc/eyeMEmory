<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>ninja · aus dem schatten</title>
<style>
body{background:#000;color:#c8d8e8;font-family:monospace;
     display:flex;align-items:center;justify-content:center;
     min-height:100vh;margin:0;flex-direction:column;gap:14px}
#g{display:grid;grid-template-columns:repeat(9,40px);gap:3px}
.c{aspect-ratio:1;border:1px solid #ffffff08;border-radius:3px;
   display:flex;align-items:center;justify-content:center;
   font-size:11px;color:transparent;transition:all .15s;cursor:crosshair}
.c:hover{background:#ff3ea522;border-color:#ff3ea5;color:#ff3ea5;
         box-shadow:0 0 14px #ff3ea5;transform:scale(1.1)}
.c.weg{color:transparent!important;background:transparent!important;
       border-color:#ffffff04!important;box-shadow:none!important;
       transform:none!important;transition:all .6s}
#hud{font-size:10px;color:#3a4a5a;letter-spacing:3px}
#hud b{color:#ff3ea5}
button{background:#000;border:1px solid #ffffff22;color:#c8d8e8;
       padding:8px 20px;border-radius:3px;font-family:inherit;
       font-size:11px;letter-spacing:2px;cursor:pointer}
button:hover{border-color:#ff3ea5;color:#ff3ea5}
</style>
</head>
<body>
<div id="g"></div>
<div id="hud">berührt: <b id="n">0</b> · treffer: <b id="t">0</b></div>
<button onclick="neu()">◈ NEU</button>
<script>
const N=9, NAMES='deinorsuw'.split('');
let cells=[], touches=0, hits=0;
for(let i=0;i<N*N;i++){
  const d=document.createElement('div');
  d.className='c';
  d.textContent = NAMES[i%9] + (Math.floor(i/9)+1);
  d.onmouseenter=()=>{
    if(d.classList.contains('weg')) return;
    touches++; document.getElementById('n').textContent=touches;
    if(Math.random()<0.15){
      d.classList.add('weg'); hits++;
      document.getElementById('t').textContent=hits;
    }
  };
  document.getElementById('g').appendChild(d);
  cells.push(d);
}
function neu(){
  cells.forEach((c,i)=>{
    c.classList.remove('weg');
    c.textContent = NAMES[i%9] + (Math.floor(i/9)+1);
  });
  touches=0; hits=0;
  document.getElementById('n').textContent=0;
  document.getElementById('t').textContent=0;
}
</script>
</body>
</html>
