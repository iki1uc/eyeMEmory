<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>lauf · das spiel im spiel · iki1uc</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#02060a; --fg:#c8d8e8; --dim:#2a3a4a;
    --cyan:#5cf0ff; --violet:#b388ff; --gold:#f0d080;
    --gut:#39ff88; --bad:#ff3ea5;
  }
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);color:var(--fg);
    font:11px/1.5 Consolas,"Courier New",monospace;
    background-image:radial-gradient(ellipse at 50% 50%, #081420, #02060a 70%);
  }
  canvas{display:block;position:fixed;inset:0}

  #kopf{
    position:fixed;top:24px;left:50%;transform:translateX(-50%);
    text-align:center;z-index:6;pointer-events:none;
  }
  #kopf h1{
    font-size:14px;letter-spacing:6px;font-weight:400;
    background:linear-gradient(90deg,var(--cyan),var(--violet),var(--gold));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }
  #kopf .sub{font-size:9px;letter-spacing:4px;color:var(--dim);margin-top:6px}

  #phase{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    z-index:5;pointer-events:none;text-align:center;
    font-size:clamp(24px,5vw,52px);font-weight:100;letter-spacing:.4em;
    transition:color .5s, text-shadow .5s;
  }
  #phase.aufbau{color:var(--cyan);text-shadow:0 0 40px var(--cyan)}
  #phase.steht{color:var(--gold);text-shadow:0 0 40px var(--gold)}
  #phase.abbau{color:var(--violet);text-shadow:0 0 40px var(--violet)}

  #seiten{
    position:fixed;top:50%;transform:translateY(-50%);
    z-index:6;pointer-events:none;font-size:9.5px;
    letter-spacing:.3em;color:var(--dim);line-height:2.4;
  }
  #links{left:24px}
  #rechts{right:24px;text-align:right}
  #seiten .v{color:var(--cyan)}
  #seiten .g{color:var(--gold)}
  #seiten .p{color:var(--violet)}
  #seiten .gut{color:var(--gut)}

  #fuss{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    font-size:9px;letter-spacing:.4em;color:var(--dim);
    z-index:6;pointer-events:none;text-align:center;
  }
  #fuss b{color:var(--gut);font-weight:400}

  .ecke{position:fixed;width:14px;height:14px;
        z-index:998;pointer-events:none;opacity:.3;border-color:var(--cyan)}
  .ecke.ol{top:12px;left:12px;border-top:1px solid;border-left:1px solid}
  .ecke.or{top:12px;right:12px;border-top:1px solid;border-right:1px solid}
  .ecke.ul{bottom:12px;left:12px;border-bottom:1px solid;border-left:1px solid}
  .ecke.ur{bottom:12px;right:12px;border-bottom:1px solid;border-right:1px solid}
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="kopf">
  <h1>lauf</h1>
  <div class="sub">das spiel im spiel · aufbau · steht · abbau</div>
</div>

<div id="phase" class="aufbau">aufbau</div>

<div id="seiten">
  <div id="links">
    <div>stufe · <span class="v" id="sStufe">0</span> / 9</div>
    <div>züge · <span class="v" id="sZüge">0</span></div>
    <div>läufe · <span class="v" id="sLäufe">0</span></div>
  </div>
  <div id="rechts">
    <div>tick · <span class="g" id="sTick">0</span></div>
    <div>zahl · <span class="p" id="sZahl">3</span></div>
    <div>garantie · <span class="gut">läuft</span></div>
  </div>
</div>

<div id="fuss">
  aufbau · steht · abbau · <b>und immer wieder</b>
</div>

<div class="ecke ol"></div>
<div class="ecke or"></div>
<div class="ecke ul"></div>
<div class="ecke ur"></div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════
   lauf · das spiel im spiel
   ═══════════════════════════════════════════════════════════
   Eine Pyramide baut sich auf.
   Sie steht. Kurz.
   Sie baut sich ab.
   Sie baut sich wieder auf.

   Das ist der Lauf.
   Die Garantie: er läuft weiter.
   ═══════════════════════════════════════════════════════════ */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H, CX, CY;

function resize(){
  const dpr = Math.min(devicePixelRatio, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  CX = W/2; CY = H/2;
}
addEventListener('resize', resize); resize();

/* ─── DIE ZAHLEN ──────────────────────────────────────
   Die Stufen tragen Zahlen. Sie wachsen mit der Höhe.
   3 · 9 · 27 · 81 · 243 · 729 · 2187 · 6561 · 19683
─────────────────────────────────────────────────── */
const ZAHLEN = [3, 9, 27, 81, 243, 729, 2187, 6561, 19683];

/* ─── ZUSTAND ──────────────────────────────────────── */
const S = {
  t: 0,
  tick: 0,
  züge: 0,
  läufe: 0,
  phase: 'aufbau',     // aufbau · steht · abbau
  phaseT: 0,
  stufe: 0,            // wie viele stufen gerade sichtbar
  zielStufe: 0,        // wohin es geht
};

/* ─── PHASEN ───────────────────────────────────────── */
const PHASEN = {
  aufbau: { dauer: 400,  ziel: 9 },   // alle 400ms eine stufe hoch
  steht:  { dauer: 3000, ziel: 9 },   // 3 sekunden stehen
  abbau:  { dauer: 400,  ziel: 0 },   // alle 400ms eine stufe runter
};

/* ─── TICK · jede sekunde ────────────────────────────── */
setInterval(() => {
  S.tick++;
  document.getElementById('sTick').textContent = S.tick;
}, 1000);

/* ─── DER LAUF ──────────────────────────────────────── */
let letzterPhasenWechsel = 0;

function lauf(t){
  const delta = t - letzterPhasenWechsel;
  letzterPhasenWechsel = t;

  const p = PHASEN[S.phase];

  /* Aufbau und Abbau ticken in Schritten */
  if(S.phase === 'aufbau' || S.phase === 'abbau'){
    if(S.phaseT >= p.dauer){
      S.phaseT = 0;
      S.züge++;

      if(S.phase === 'aufbau'){
        S.stufe++;
        if(S.stufe >= 9){
          S.stufe = 9;
          S.phase = 'steht';
          S.phaseT = 0;
          zeigePhase('steht');
        }
      } else {
        S.stufe--;
        if(S.stufe <= 0){
          S.stufe = 0;
          S.phase = 'aufbau';
          S.phaseT = 0;
          S.läufe++;
          zeigePhase('aufbau');
        }
      }
      aktualisiereZahlen();
    }
  } else if(S.phase === 'steht'){
    if(S.phaseT >= p.dauer){
      S.phaseT = 0;
      S.phase = 'abbau';
      zeigePhase('abbau');
    }
  }

  S.phaseT += delta;
}

function zeigePhase(name){
  const el = document.getElementById('phase');
  el.classList.remove('aufbau','steht','abbau');
  el.classList.add(name);
  el.textContent = name;
  S.phase = name;
}

function aktualisiereZahlen(){
  document.getElementById('sStufe').textContent = S.stufe;
  document.getElementById('sZüge').textContent = S.züge;
  document.getElementById('sLäufe').textContent = S.läufe;
  const z = ZAHLEN[Math.max(0, S.stufe - 1)] || 3;
  document.getElementById('sZahl').textContent = z.toLocaleString('de-DE');
}

/* ─── ZEICHNEN ──────────────────────────────────────── */
function zeichne(){
  requestAnimationFrame(zeichne);
  S.t += 16;

  // hintergrund sanft nachziehen
  ctx.fillStyle = 'rgba(2,6,10,0.22)';
  ctx.fillRect(0, 0, W, H);

  /* ─── DIE PYRAMIDE ────────────────────────────────
     9 stufen. jede stufe ist ein horizontaler strich,
     der schmaler wird, je höher er liegt.           */
  const basisBreite = Math.min(W, H) * 0.85;
  const stufenHöhe  = Math.min(W, H) * 0.055;
  const basisY      = CY + stufenHöhe * 9 / 2;

  // welche farben je phase
  const phasenFarbe =
    S.phase === 'aufbau' ? '#5cf0ff' :
    S.phase === 'steht'  ? '#f0d080' :
                           '#b388ff';

  for(let i = 0; i < 9; i++){
    const sichtbar = i < S.stufe;
    const y = basisY - i * stufenHöhe;
    const breite = basisBreite * (1 - i * 0.09);
    const x0 = CX - breite / 2;
    const x1 = CX + breite / 2;

    // die zahl dieser stufe
    const zahl = ZAHLEN[i];

    if(sichtbar){
      // die stufe
      ctx.beginPath();
      ctx.moveTo(x0, y);
      ctx.lineTo(x1, y);
      ctx.strokeStyle = hexA(phasenFarbe, 0.75);
      ctx.lineWidth = 1.6;
      ctx.stroke();

      // linker punkt
      ctx.beginPath();
      ctx.arc(x0, y, 2.5, 0, Math.PI*2);
      ctx.fillStyle = phasenFarbe;
      ctx.fill();

      // rechter punkt
      ctx.beginPath();
      ctx.arc(x1, y, 2.5, 0, Math.PI*2);
      ctx.fillStyle = phasenFarbe;
      ctx.fill();

      // die zahl in der mitte
      ctx.font = '10px Consolas';
      ctx.fillStyle = hexA(phasenFarbe, 0.85);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(zahl.toLocaleString('de-DE'), CX, y - 8);

      // glühen um die zahl bei "steht"
      if(S.phase === 'steht'){
        const puls = 0.5 + 0.5 * Math.sin(S.t * 0.004 + i);
        ctx.beginPath();
        ctx.arc(CX, y - 8, 12 + puls * 4, 0, Math.PI*2);
        ctx.strokeStyle = hexA(phasenFarbe, 0.15 * puls);
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
    } else {
      // die stufe ist noch nicht / nicht mehr da
      // nur eine spur, sehr schwach
      ctx.beginPath();
      ctx.moveTo(x0, y);
      ctx.lineTo(x1, y);
      ctx.strokeStyle = hexA(phasenFarbe, 0.06);
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
  }

  /* ─── DIE SPITZE ──────────────────────────────────
     Wenn alle 9 stufen stehen, gibt es die 10. stufe.
     Sie ist nur ein punkt — der eine punkt.           */
  if(S.stufe === 9){
    const spitzeY = basisY - 9 * stufenHöhe;
    const puls = 0.5 + 0.5 * Math.sin(S.t * 0.003);

    ctx.beginPath();
    ctx.arc(CX, spitzeY, 4 + puls * 3, 0, Math.PI*2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    // strahlen
    for(let a = 0; a < 8; a++){
      const winkel = (a / 8) * Math.PI * 2 + S.t * 0.0005;
      const r0 = 8 + puls * 4;
      const r1 = 20 + puls * 8;
      ctx.beginPath();
      ctx.moveTo(CX + Math.cos(winkel) * r0, spitzeY + Math.sin(winkel) * r0);
      ctx.lineTo(CX + Math.cos(winkel) * r1, spitzeY + Math.sin(winkel) * r1);
      ctx.strokeStyle = hexA('#ffffff', 0.4 * puls);
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
  }

  /* ─── DER LAUF · die wandernde linie ──────────────
     Ein kreis, der nach innen zieht und wieder nach außen.
     Das ist der lauf selbst — sichtbar.              */
  const laufR = Math.min(W, H) * 0.45;
  const laufPuls = (S.t * 0.0004) % 1;
  const laufAktuell = laufR * (1 - laufPuls);

  ctx.beginPath();
  ctx.arc(CX, CY, laufAktuell, 0, Math.PI*2);
  ctx.strokeStyle = hexA(phasenFarbe, 0.08 * (1 - laufPuls));
  ctx.lineWidth = 0.6;
  ctx.stroke();

  /* ─── DIE BAHN · ring um die pyramide ───────────── */
  ctx.beginPath();
  ctx.arc(CX, CY, basisBreite * 0.62, 0, Math.PI*2);
  ctx.strokeStyle = hexA(phasenFarbe, 0.06);
  ctx.lineWidth = 0.8;
  ctx.stroke();

  /* ─── DREI WANDERNDE PUNKTE ──────────────────────
     Drei läufer, die auf der bahn kreisen.
     Sie zeigen: der lauf läuft immer.               */
  for(let i = 0; i < 3; i++){
    const winkel = S.t * 0.0003 + (i / 3) * Math.PI * 2;
    const x = CX + Math.cos(winkel) * basisBreite * 0.62;
    const y = CY + Math.sin(winkel) * basisBreite * 0.62;

    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI*2);
    ctx.fillStyle = phasenFarbe;
    ctx.globalAlpha = 0.7;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // der lauf selbst
  lauf(S.t);
}

function hexA(hex, a){
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ─── INIT ─────────────────────────────────────────── */
aktualisiereZahlen();
letzterPhasenWechsel = 0;
zeichne();

console.log('');
console.log('  lauf · das spiel im spiel');
console.log('  ─────────────────────────────────');
console.log('  aufbau · steht · abbau · und wieder');
console.log('  9 stufen · 3 bis 19683');
console.log('  garantie · der lauf läuft');
console.log('');

window.LAUF = {
  state: () => ({
    phase: S.phase,
    stufe: S.stufe,
    züge: S.züge,
    läufe: S.läufe,
    tick: S.tick,
    zahl: ZAHLEN[Math.max(0, S.stufe - 1)],
  }),
  zahlen: () => ZAHLEN,
  springeZu: (n) => {
    S.phase = 'steht';
    S.stufe = Math.max(0, Math.min(9, n));
    aktualisiereZahlen();
  },
};
</script>
</body>
</html>
